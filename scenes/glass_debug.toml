# A single glass sphere resting on a large diffuse one, for looking closely at
# what refraction does.

background = [0.7, 0.8, 1.0]

[materials.blue]
type = "lambertian"
color = [0.3, 0.3, 0.8]

[materials.glass]
type = "dielectric"
ior = 1.5

[[objects]]
name = "ground"
type = "sphere"
material = "blue"
center = [0.0, -100.0, 0.0]
radius = 100.0

[[objects]]
name = "glass"
type = "sphere"
material = "glass"
center = [0.0, 1.0, 0.0]
radius = 1.0
